# Overlay for classic docker-compose. Paths are relative to the FIRST Compose file,
# /var/docker/2.0plipshop/docker-compose.yml. Do not run this file on its own.
version: '3.7'
services:
  videolab:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: videolab
    user: "1000:1000"
    init: true
    cpus: 0.50
    cpuset: "1"
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    environment:
      PORT: "8090"
      VIDEOLAB_DIR: /data/videolab
      MUSICA_DIR: /data/musica
      TRANSFERENCIAS_URL: http://transferencias:8080
    volumes:
      - /var/lib/plip/videolab:/data/videolab
      - /var/lib/plip/musica:/data/musica
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/api/videolab/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
