server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: resolve again after the API container is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    location ~ ^/api/transferencias(?:/|$) {
        set $transferencias_upstream http://transferencias:8080;
        proxy_pass $transferencias_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_intercept_errors off;

        # Node enforces the per-file limit (5120 MiB by default), including multipart.
        client_max_body_size 0;
        client_body_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    location ~ ^/api/videolab(?:/|$) {
        set $videolab_upstream http://videolab:8090;
        proxy_pass $videolab_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;
        client_body_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
